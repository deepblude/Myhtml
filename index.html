<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Peaceful Eve for Krystal ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #050b14 0%, #101825 100%);
            font-family: 'Montserrat', sans-serif;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        /* --- 启动画面 --- */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(15px);
            transition: opacity 1.2s ease;
        }

        .gift-icon {
            font-size: 4.5rem;
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 59, 59, 0.5));
            cursor: pointer;
            transition: transform 0.3s;
        }
        .gift-icon:active { transform: scale(0.9); }

        #start-overlay h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #fff;
            margin: 0;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }

        #start-overlay p {
            font-size: 0.85rem;
            letter-spacing: 4px;
            opacity: 0.6;
            text-transform: uppercase;
            margin-top: 15px;
            font-weight: 300;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* --- 主界面 --- */
        .main-title {
            position: absolute;
            top: 12%;
            width: 100%;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s;
            z-index: 5;
        }

        canvas { display: block; }

        /* --- 交互栏 --- */
        .ui-dock {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            opacity: 0;
            transition: opacity 1.5s, transform 1.5s;
            transform-origin: center bottom;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.4rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-3px); color: #fff; }
        .icon-btn:active { transform: scale(0.9); }
        
        .icon-btn.active::after {
            content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px;
            background: #ffd700; border-radius: 50%; box-shadow: 0 0 5px #ffd700;
        }

        /* 祈福按钮 - 苹果红 */
        .charm-btn {
            background: rgba(255, 60, 60, 0.15);
            border: 1px solid rgba(255, 60, 60, 0.3);
            color: #ff4d4d;
        }
        .charm-btn:active {
             background: rgba(255, 60, 60, 0.4);
             box-shadow: 0 0 15px #ff4d4d;
        }

        .spin-anim { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="start-overlay" onclick="startShow()">
        <div class="gift-icon">🍎</div>
        <h1>For Krystal</h1>
        <p>Tap to Open</p>
    </div>

    <h1 class="main-title" id="mainTitle">Merry Christmas Eve</h1>
    <canvas id="canvas"></canvas>

    <audio id="bgm" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="ui-dock" id="uiDock">
        <button class="icon-btn" id="btnMusic" onclick="toggleMusic()"><span>🎵</span></button>
        <button class="icon-btn active" id="btnLight" onclick="toggleLightMode()"><span>✨</span></button>
        <button class="icon-btn" onclick="triggerFireworkBatch()"><span>🎆</span></button>
        <button class="icon-btn" id="btnSnow" onclick="toggleSnow()"><span>❄️</span></button>
        <button class="icon-btn charm-btn" onclick="triggerCharms()"><span>🍎</span></button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgm');
        
        const uiDock = document.getElementById('uiDock');
        const btnMusic = document.getElementById('btnMusic');
        const btnLight = document.getElementById('btnLight');
        const btnSnow = document.getElementById('btnSnow');
        
        let width, height;
        let particles = [], sparkles = [], fireworks = [], floatTexts = [], lights = [];
        let rotationAngle = 0; 
        let lightMode = 'warm'; 
        let snowMode = 'gentle'; 
        let snowIntensity = 80;

        const sparkleColors = ['#FFD700', '#FFB6C1', '#E0FFFF', '#FFFFFF'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function startShow() {
            const overlay = document.getElementById('start-overlay');
            const title = document.getElementById('mainTitle');
            
            audio.volume = 0.6;
            audio.play().then(() => {
                btnMusic.firstElementChild.classList.add('spin-anim');
                btnMusic.classList.add('active');
            }).catch(e => console.log(e));

            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                uiDock.style.opacity = '1';
                uiDock.style.transform = 'translateX(-50%) translateY(0)';
                title.style.opacity = '1';
                triggerFireworkBatch();
            }, 1000);

            initSnow();
            initTreeDecorations();
            loop();
        }

        function toggleMusic() {
            if(audio.paused) {
                audio.play();
                btnMusic.firstElementChild.classList.add('spin-anim');
                btnMusic.classList.add('active');
            } else {
                audio.pause();
                btnMusic.firstElementChild.classList.remove('spin-anim');
                btnMusic.classList.remove('active');
            }
        }

        function toggleLightMode() {
            if (lightMode === 'warm') {
                lightMode = 'festive';
                btnLight.classList.remove('active');
                btnLight.querySelector('span').innerText = '🌈';
            } else {
                lightMode = 'warm';
                btnLight.classList.add('active');
                btnLight.querySelector('span').innerText = '✨';
            }
            updateLightColors();
        }

        function toggleSnow() {
            if (snowMode === 'gentle') {
                snowMode = 'heavy';
                snowIntensity = 200;
                btnSnow.classList.add('active');
            } else {
                snowMode = 'gentle';
                snowIntensity = 80;
                btnSnow.classList.remove('active');
            }
            initSnow();
        }

        function updateLightColors() {
            lights.forEach(l => { if (l.type === 'light') l.setModeColor(lightMode); });
        }

        // === 🍎 祈福核心逻辑：有序队列 ===
        function triggerCharms() {
            // 定义一个精美的播放列表，而不是随机生成
            const charmSequence = [
                "🍎", 
                "平平安安", 
                "🍎", 
                "Happy Christmas Eve",
                "🍎", 
                "平平安安", 
                "🍎", 
                "Krystal number one!!" // 压轴
            ];

            // 使用队列间隔生成，避免拥挤
            charmSequence.forEach((text, index) => {
                setTimeout(() => {
                    // 如果是最后一句压轴，传入 forceCenter = true
                    const isFinale = (text === "Krystal number one!!");
                    floatTexts.push(new FloatingElement(true, text, isFinale));
                }, index * 800); // 间隔 800毫秒，非常有序，不会重叠
            });
        }

        // === 指尖特效 ===
        window.addEventListener('touchmove', e => {
            for(let i=0; i<3; i++) createSparkles(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('mousemove', e => {
            for(let i=0; i<2; i++) createSparkles(e.clientX, e.clientY);
        });
        
        function createSparkles(x, y) { sparkles.push(new Sparkle(x, y)); }

        class Sparkle {
            constructor(x, y) {
                this.x = x; this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2; 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
                this.decay = 0.015 + Math.random() * 0.02; 
                this.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
                this.size = 1 + Math.random() * 3;
            }
            update() { 
                this.x += this.vx; this.y += this.vy + 0.5; 
                this.vx *= 0.95; this.vy *= 0.95;
                this.life -= this.decay; 
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.globalCompositeOperation = 'lighter'; 
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        // === 漂浮元素 (有序版) ===
        class FloatingElement {
            constructor(isForcedCharm = false, specificText = null, forceCenter = false) {
                
                // 位置控制：避免贴边
                if (forceCenter) {
                    // 强制在屏幕正中间生成
                    this.x = width / 2;
                } else {
                    // 随机位置，但留出左右边距，防止被切断
                    this.x = Math.random() * (width - 100) + 50; 
                }
                
                this.y = height + 40;
                
                if (isForcedCharm && specificText) {
                    this.text = specificText;
                    this.isCharm = true;
                    
                    // 尺寸逻辑
                    if (this.text === "Krystal number one!!") {
                        this.size = width < 600 ? 28 : 38; // 手机端适配
                    } else if (this.text === "Happy Christmas Eve") {
                        this.size = width < 600 ? 24 : 32;
                    } else if (this.text === "平平安安") {
                        this.size = 30;
                    } else {
                        this.size = 40; // 苹果
                    }
                    
                    // 速度减慢，更优雅
                    this.speed = 1.0 + Math.random() * 0.3;
                } else {
                    // 随机背景文字
                    const normal = ["Warmth", "Joy", "Eve", "❄️"];
                    this.text = normal[Math.floor(Math.random() * normal.length)];
                    this.isCharm = false;
                    this.size = 14 + Math.random() * 8;
                    this.speed = 0.3 + Math.random() * 0.4;
                }

                this.alpha = 0.01; 
                this.fadeIn = true;
            }
            
            update() {
                this.y -= this.speed;
                if(this.fadeIn) { 
                    this.alpha += 0.02; 
                    if(this.alpha >= (this.isCharm ? 1 : 0.7)) this.fadeIn = false; 
                } else { 
                    this.alpha -= (this.isCharm ? 0.002 : 0.005); 
                }
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                // --- Krystal number one 特殊样式 ---
                if (this.text === "Krystal number one!!") {
                    // 字体：使用最粗的字体，且斜体，增加冲击力
                    ctx.font = `italic 900 ${this.size}px 'Montserrat', sans-serif`;
                    // 颜色：电光蓝
                    ctx.fillStyle = "#00ffff"; 
                    // 发光：强烈的蓝色光晕
                    ctx.shadowColor = "#00bfff";
                    ctx.shadowBlur = 30;
                } 
                else if(this.text === "🍎") {
                    ctx.font = `${this.size}px Arial`;
                    ctx.shadowColor = "#ff4d4d";
                    ctx.shadowBlur = 20;
                } else if (this.isCharm) {
                    // 金色字体
                    ctx.font = (this.text === "Happy Christmas Eve") ? 
                        `bold ${this.size}px 'Great Vibes'` : 
                        `bold ${this.size}px sans-serif`;
                    ctx.shadowColor = "#ffd700";
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = (this.text === "平平安安") ? "#ffeb3b" : "#fff";
                } else {
                    ctx.font = `${this.size}px 'Montserrat'`;
                    ctx.shadowColor = "transparent";
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "rgba(255,255,255,0.8)";
                }

                ctx.textAlign = "center";
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // === 树与装饰 ===
        class TreeDecoration {
            constructor(yPercent, type) {
                this.yPercent = yPercent; 
                this.radiusRatio = yPercent * 120; 
                this.angle = Math.random() * Math.PI * 2;
                this.type = type; 
                this.color = '#fff';
                if(this.type === 'light') this.setModeColor('warm');
            }
            setModeColor(mode) {
                if(mode === 'warm') {
                    const warms = ['#ffd700', '#ffeb3b', '#ffcc80', '#ffffff'];
                    this.color = warms[Math.floor(Math.random() * warms.length)];
                } else {
                    const festives = ['#ff3b3b', '#00e676', '#2979ff', '#ffd700'];
                    this.color = festives[Math.floor(Math.random() * festives.length)];
                }
            }
            draw(treeBaseX, treeBaseY, treeHeight) {
                let currentY = treeBaseY - treeHeight * (1 - this.yPercent);
                let currentRadius = this.radiusRatio * (width < 600 ? 1.0 : 1.3) * (1 - this.yPercent * 0.1); 
                let x = treeBaseX + Math.cos(this.angle + rotationAngle) * currentRadius;
                let z = Math.sin(this.angle + rotationAngle); 
                
                let alpha = z > 0 ? 1 : 0.3; 
                let scale = z > 0 ? 1 : 0.7;
                ctx.globalAlpha = alpha;
                
                if (this.type === 'light') {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = z > 0 ? 10 : 0;
                    ctx.shadowColor = this.color;
                    ctx.beginPath(); ctx.arc(x, currentY, 2.5 * scale, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (this.type === 'apple') {
                    let appleSize = 5 * scale;
                    ctx.shadowBlur = z > 0 ? 8 : 0; ctx.shadowColor = "#d32f2f";
                    ctx.fillStyle = "#d32f2f"; ctx.beginPath(); ctx.arc(x, currentY, appleSize, 0, Math.PI*2); ctx.fill();
                    if(z > 0) { 
                        ctx.fillStyle = "#4caf50"; ctx.fillRect(x, currentY - appleSize - 1, 2 * scale, 3 * scale);
                        ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.beginPath(); ctx.arc(x - 2, currentY - 2, 1.5, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }
            }
        }

        function initTreeDecorations() {
            lights = [];
            for(let i=0; i<200; i++) {
                let yPer = i / 200; 
                let type = Math.random() < 0.2 ? 'apple' : 'light'; 
                lights.push(new TreeDecoration(yPer, type));
            }
        }

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2.5 + 0.5;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.gravity = 0.04; this.life = 1; this.color = color;
                this.decay = Math.random() * 0.015 + 0.01;
            }
            update() { this.vx *= 0.95; this.vy *= 0.95; this.vy += this.gravity; this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, 2, 2); }
        }

        function initSnow() {
            particles = [];
            for(let i=0; i<snowIntensity; i++) {
                particles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    vy: 0.5 + Math.random() * (snowMode === 'heavy' ? 3 : 1.5),
                    r: Math.random() * (snowMode === 'heavy' ? 2.5 : 1.5),
                });
            }
        }

        function launchFirework(x, y) {
            let color = `hsl(${Math.random()*40 + 340}, 100%, 75%)`;
            for(let i=0; i<30; i++) fireworks.push(new FireworkParticle(x, y, color));
        }

        function triggerFireworkBatch() {
            for(let i=0; i<5; i++) {
                setTimeout(() => { launchFirework(width*0.2 + Math.random()*width*0.6, height*0.15 + Math.random()*height*0.4); }, i * 350);
            }
        }

        function drawTree(x, y, scale) {
            ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
            let grad = ctx.createLinearGradient(0, -300, 0, 0);
            grad.addColorStop(0, "#0a2a18"); grad.addColorStop(1, "#021108"); 
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.moveTo(0, -300); ctx.lineTo(110, 10); ctx.quadraticCurveTo(0, 25, -110, 10); ctx.closePath(); ctx.fill();
            ctx.fillStyle = "#1a1005"; ctx.fillRect(-12, 10, 24, 35); 
            ctx.shadowColor = "#ffeb3b"; ctx.shadowBlur = 25; ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(0, -300, 4.5, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function loop() {
            ctx.fillStyle = "rgba(5, 11, 20, 0.4)"; ctx.fillRect(0, 0, width, height);
            rotationAngle += 0.012; 

            // 偶尔出现的随机文字
            if(Math.random() < 0.01) floatTexts.push(new FloatingElement(false));

            const treeX = width / 2; const treeY = height - 120; const scale = width < 600 ? 1.15 : 1.45;
            
            drawTree(treeX, treeY, scale);
            lights.forEach(l => l.draw(treeX, treeY, 300 * scale));

            floatTexts.forEach(t => { t.update(); t.draw(); });
            floatTexts = floatTexts.filter(t => t.y > -50 && (t.fadeIn || t.alpha > 0));

            ctx.fillStyle = "rgba(255,255,255,0.8)";
            particles.forEach(p => {
                p.y += p.vy; if(p.y > height) p.y = -10;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            });

            fireworks = fireworks.filter(f => f.life > 0); fireworks.forEach(f => { f.update(); f.draw(); });
            sparkles = sparkles.filter(s => s.life > 0); sparkles.forEach(s => { s.update(); s.draw(); });

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
